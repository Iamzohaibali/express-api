name: CI - Test, Build, Push and Update Kubernetes

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test:
    name: Test Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: test

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    outputs:
      image_tag: ${{ steps.image.outputs.tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set image tag
        id: image
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/express-api:${{ steps.image.outputs.tag }} \
            .

      - name: Push Docker image
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/express-api:${{ steps.image.outputs.tag }}

  update-kubernetes:
    name: Update Kubernetes Repository
    runs-on: ubuntu-latest
    needs: docker

    steps:
      - name: Checkout Kubernetes repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/k8s-infrastructure
          token: ${{ secrets.K8S_REPO_TOKEN }}
          path: k8s-infrastructure

      - name: Update Docker image tag
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ needs.docker.outputs.image_tag }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import re

          file = Path("k8s-infrastructure/environments/production/deployment.yaml")

          text = file.read_text()

          image = f"{os.environ['DOCKERHUB_USERNAME']}/express-api:{os.environ['IMAGE_TAG']}"

          text = re.sub(
              r"image:\s*\S+",
              f"image: {image}",
              text,
              count=1
          )

          file.write_text(text)
          PY

      - name: Commit Kubernetes change
        working-directory: k8s-infrastructure
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add environments/production/deployment.yaml

          git diff --cached --quiet || git commit \
            -m "Update express-api image to ${{ needs.docker.outputs.image_tag }}"

      - name: Push Kubernetes change
        working-directory: k8s-infrastructure
        run: |
          git push